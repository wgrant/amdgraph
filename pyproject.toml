[project]
name = "amdgraph"
version = "0.1.0"
description = "Live strip charts for AMD Ryzen laptops, from the SMU's own telemetry"
readme = "README.md"
license = "MIT"
authors = [{ name = "William Grant", email = "me@williamgrant.id.au" }]
# 3.9 rather than the interpreter this was written on: SteamOS and other
# appliance distributions lag, and one of the target machines is a Steam Deck.
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "PyQt6",
    "rich>=13",
]

[project.scripts]
amdgraph = "amdgraph.__main__:main"
amdgraph-tui = "amdgraph.tui:main"

[dependency-groups]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amdgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Widget tests force QT_QPA_PLATFORM=offscreen in conftest, so the suite never
# tries to open a window and is safe to run over ssh or from a hook.

[tool.mypy]
python_version = "3.9"
files = [
    "src/amdgraph/model.py",
    "src/amdgraph/smu",
    "src/amdgraph/backends",
    "src/amdgraph/sampler.py",
]
check_untyped_defs = true
follow_imports = "skip"
warn_redundant_casts = true
warn_unused_ignores = true
